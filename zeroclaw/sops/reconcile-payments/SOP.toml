[sop]
name = "reconcile-payments"
description = "Read-only Solana payment reconciliation for pending BountyDesk invoices"
version = "0.1.0"
priority = "low"
execution_mode = "auto"
cooldown_secs = 60
max_concurrent = 1
admission_policy = "coalesce"
agent = "default"

[[triggers]]
type = "manual"

[[triggers]]
type = "cron"
expression = "0 */5 * * * *"
