[package]
name = "bounty-desk"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Keyless Solana Pay invoice creation and on-chain settlement reconciliation for ZeroClaw agents"
repository = "https://github.com/xuechenrui/bounty-desk"

[dependencies]
anyhow = "=1.0.93"
bs58 = "=0.5.1"
chrono = { version = "=0.4.38", features = ["serde"] }
clap = { version = "=4.5.21", features = ["derive"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
sha2 = "=0.10.8"
